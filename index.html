<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ad Finder</title>
    <style>
      body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
      .card { display: inline-block; vertical-align: top; width: 200px; margin: 8px; color: inherit; text-decoration: none; }
      .card img { width: 100%; height: 260px; object-fit: cover; background: #eee; }
    </style>
  </head>
  <body>
    <h1>Ad Finder</h1>

    <form id="search">
      <input id="brand" placeholder="Brand name, e.g. Factor" />
      <button>Search</button>
    </form>

    <div id="results"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
